const $=id=>document.getElementById(id),get=(k,d)=>{try{return JSON.parse(localStorage.getItem('mypanda:'+k))??d}catch{return d}},set=(k,v)=>{try{localStorage.setItem('mypanda:'+k,JSON.stringify(v));return true}catch{alert('Spazio di salvataggio insufficiente o non disponibile.');return false}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
sections.forEach(([name,desc,svg],i)=>{if(i===3)return;let b=document.createElement('button');b.className='tile';b.innerHTML=`<svg viewBox="0 0 24 24">${svg}</svg><b>${name}</b><small>${desc}</small>`;b.onclick=()=>openSection(i);$('menu').append(b)});$('back').onclick=()=>{if(currentSection!==null)history.back()};
function showHome(){currentSection=null;$('detail').classList.add('hidden');$('home').classList.remove('hidden');animateScreen($('home'),'screen-back');window.scrollTo(0,0);refresh()}

function showPhoto(key){const box=$(key+'Box'),img=box.querySelector('img'),v=get(key,null);box.classList.toggle('has',!!v);if(v)img.src=v;else img.removeAttribute('src')}
for(const key of ['car','plate']){const box=$(key+'Box');let del=document.createElement('button');del.className='remove';del.textContent='Rimuovi';del.onclick=()=>{if(confirm('Rimuovere la foto?')&&set(key,null)){showPhoto(key);notify('Foto rimossa')}};box.append(del);showPhoto(key);$(key).onchange=()=>{let f=$(key).files[0];$(key).value='';if(!f)return;let r=new FileReader();const fail=()=>alert('Impossibile leggere questa immagine. Prova una foto JPEG o PNG.');r.onerror=fail;r.onload=()=>{let a=new Image();a.onerror=fail;a.onload=()=>{try{let c=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(a.width,a.height));c.width=Math.max(1,Math.round(a.width*scale));c.height=Math.max(1,Math.round(a.height*scale));c.getContext('2d').drawImage(a,0,0,c.width,c.height);if(set(key,c.toDataURL('image/jpeg',.85))){showPhoto(key);notify('Foto salvata')}}catch(e){fail()}};a.src=r.result};r.readAsDataURL(f)}}

let toastTimer;function notify(message){const t=$('toast');t.textContent=message;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2800)}
const fields={1:[['descrizione','Scadenza (es. assicurazione)','text'],['data','Data di scadenza','date']],2:[['descrizione','Descrizione','text'],['data','Data','date'],['importo','Importo (€)','number']],4:[['descrizione','Intervento','text'],['data','Data','date'],['importo','Costo (€), facoltativo','number'],['officina','Officina, facoltativa','text'],['note','Note, facoltative','text']]};
let tab='planned';const records=()=>{let r=get('records',[]);return Array.isArray(r)?r:[]};const status=r=>r.stato||'done';const day=d=>{if(typeof d!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(d))return NaN;let [y,m,x]=d.split('-').map(Number);if(y<1000||y>9999)return NaN;let t=new Date(Date.UTC(y,m-1,x));return t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===x?t.getTime()/86400000:NaN};const today=()=>{let d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000};const remaining=r=>day(r.data)-today();const due=r=>(r.section===1&&r.stato!=='done')||(r.section===4&&status(r)==='planned');const dateFmt=d=>d?d.split('-').reverse().join('/'):'—';const label=r=>r.descrizione||sections[r.section][0];const relative=r=>!Number.isFinite(remaining(r))?'Data non valida':remaining(r)<0?'Scaduta da '+(-remaining(r))+' giorni':remaining(r)===0?'Oggi':'Tra '+remaining(r)+' giorni';
function refresh(){const upcoming=records().filter(r=>due(r)&&Number.isFinite(remaining(r))&&remaining(r)<=30).sort((a,b)=>remaining(a)-remaining(b));$('alerts').innerHTML='<div class="notice"><div class="notice-head"><strong>Promemoria · '+upcoming.length+'</strong><span>Scadute e prossimi 30 giorni</span></div>'+ (upcoming.length?upcoming.map(r=>'<p class="'+(remaining(r)<0?'late':remaining(r)<=7?'soon':'future')+'">'+esc(label(r))+' · '+esc(relative(r))+'</p>').join(''):'<p class="muted">Nessuna scadenza nei prossimi 30 giorni.</p>')+'</div>'}
function foldICS(s){let out=[],line="",n=0;for(let ch of s){let b=new TextEncoder().encode(ch).length;if(n+b>75){out.push(line);line=" ";n=1}line+=ch;n+=b}out.push(line);return out.join("\r\n")}function calendar(r){if(!r||!Number.isFinite(day(r.data))){alert('Data non valida');return;}if(r.calendarExported&&!confirm('File calendario già preparato. Esportarlo di nuovo potrebbe creare un duplicato. Continuare?'))return;let date=r.data.replaceAll('-','');let title=String(label(r)).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');let lines=['BEGIN:VCALENDAR','VERSION:2.0','CALSCALE:GREGORIAN','PRODID:-//myPanda//IT','BEGIN:VEVENT','UID:'+r.id+'@mypanda','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z/,'Z'),'DTSTART:'+date+'T090000','DTEND:'+date+'T091500','SUMMARY:myPanda - '+title,'DESCRIPTION:Scadenza o manutenzione programmata'];for(let n of [30,15,7,1,0])lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Promemoria myPanda','TRIGGER:'+(n?'-P'+n+'D':'PT0M'),'END:VALARM');lines.push('END:VEVENT','END:VCALENDAR');const file=new File([lines.map(foldICS).join('\r\n')+'\r\n'],'myPanda-promemoria.ics',{type:'text/calendar'});const marked=()=>{if(dialog.open)dialog.close();if(set('records',records().map(x=>x.id===r.id?{...x,calendarExported:true}:x))){notify('File calendario preparato');if(currentSection!==null)openSection(currentSection)}};const download=()=>{let u=URL.createObjectURL(file);let a=document.createElement('a');a.href=u;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);marked()};let dialog=document.createElement('dialog');dialog.style.cssText='background:#202325;color:#fff;border:1px solid #454a4d;border-radius:18px;padding:22px;width:min(90vw,420px)';dialog.innerHTML='<h2 style="margin-top:0">Aggiungi al calendario</h2><p>'+esc(label(r))+' · '+esc(dateFmt(r.data))+' alle 09:00</p><p class="muted">Promemoria richiesti: 30, 15, 7, 1 giorno prima e il giorno stesso. Importa il file nel calendario e verifica gli avvisi. Eventuali modifiche o eliminazioni in myPanda non aggiornano gli eventi già importati.</p><div class="actions"><button class="primary" id="calShare">Condividi evento</button><button class="secondary" id="calDownload">Scarica .ics</button><button class="secondary" id="calClose">Chiudi</button></div>';document.body.append(dialog);dialog.addEventListener('close',()=>dialog.remove());dialog.querySelector('#calClose').onclick=()=>dialog.close();dialog.querySelector('#calDownload').onclick=download;let share=dialog.querySelector('#calShare');try{if(!navigator.share||!navigator.canShare||!navigator.canShare({files:[file]}))share.hidden=true}catch(e){share.hidden=true}share.onclick=async()=>{try{await navigator.share({files:[file]});marked()}catch(e){if(e.name!=='AbortError')download()}};dialog.showModal()}

function animateScreen(el,name){el.classList.remove('screen-in','screen-back','content-in');void el.offsetWidth;el.classList.add(name)}
let currentSection=null;function openSection(i,fromHistory=false){const entering=currentSection!==i;if(entering){if(i===4)tab='planned';if(!fromHistory)history.pushState({mypanda:i},'')}currentSection=i;$('home').classList.add('hidden');$('detail').classList.remove('hidden');$('sectionTitle').textContent=sections[i][0];$('sectionSubtitle').textContent=sections[i][1];$('sectionIcon').innerHTML='<svg viewBox="0 0 24 24">'+sections[i][2]+'</svg>';const c=$('content');if(entering){animateScreen($('detail'),'screen-in');window.scrollTo(0,0)}else{animateScreen(c,'content-in')}if(i===0){let d=get('auto',{});c.innerHTML='<form id="record"><label>Modello<input name="modello" value="'+esc(d.modello||'Fiat Panda Hybrid')+'" required></label><label>Anno<input name="anno" type="number" value="'+esc(d.anno||2023)+'"></label><label>Note<textarea name="note">'+esc(d.note||'')+'</textarea></label><button class="primary">Salva</button></form>';$('record').onsubmit=e=>{e.preventDefault();if(set('auto',{...d,...Object.fromEntries(new FormData(e.target))}))notify('Dati salvati')};return}
let all=records();let rows=all.filter(r=>r.section!==3&&(i===5||r.section===i)&&(i!==4||status(r)===tab)).sort((a,b)=>i===4&&tab==='planned'||i===1?(a.data||'').localeCompare(b.data||''):(b.data||'').localeCompare(a.data||''));let tabs=i===4?'<div class="tabs"><button id="planned" class="'+(tab==='planned'?'active':'')+'">Programmate</button><button id="done" class="'+(tab==='done'?'active':'')+'">Effettuate</button></div>':'';let form=i===5?'':`<form id="record">${fields[i].map(([k,l,t])=>`<label>${l}<input name="${k}" type="${t}" ${t==='number'?'min="0" step="any"':''} ${i!==4||['descrizione','data'].includes(k)?'required':''}></label>`).join('')}<button class="primary">${i===4&&tab==='planned'?'Programma intervento':'Aggiungi'}</button></form><h2 class="list-title">Registrazioni <small>${rows.length} elementi</small></h2>`;c.innerHTML=overview(i,all)+tabs+form+(rows.length?rows.map(r=>`<article class="recordcard"><span class="date ${due(r)?remaining(r)<0?'late':remaining(r)<=7?'soon':'future':''}">${esc(dateFmt(r.data))} ${due(r)?' · '+esc(relative(r)):''}</span><h3>${esc(label(r))}</h3>${r.section===4?'<small>'+ (status(r)==='planned'?'Programmata':'Effettuata')+'</small>':''}<p>${r.importo!==undefined&&r.importo!==''?'€ '+esc(r.importo):''} ${esc(r.officina||'')} ${esc(r.note||'')}</p><div class="actions">${due(r)?`<button class="secondary" data-cal="${esc(r.id)}">${r.calendarExported?'File preparato · ripeti':'Aggiungi al calendario'}</button><button class="secondary" data-done="${esc(r.id)}">${r.section===4?'Segna effettuata':'Segna conclusa'}</button>`:''}<button class="secondary" data-edit="${esc(r.id)}">Modifica</button>${r.section===1?`<button class="secondary" data-renew="${esc(r.id)}">Rinnova</button>`:''}<button class="secondary danger" data-del="${esc(r.id)}">Elimina</button></div></article>`).join(''):'<div class="empty"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12h8"/></svg><br><b>Nessuna registrazione</b><p class="muted">Le registrazioni appariranno qui.</p></div>');if(i===4)for(const t of ['planned','done'])$(t).onclick=()=>{tab=t;openSection(i)};c.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>calendar(all.find(r=>r.id===b.dataset.cal)));c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editRecord(records().find(r=>r.id===b.dataset.edit),'edit',i));c.querySelectorAll('[data-renew]').forEach(b=>b.onclick=()=>editRecord(records().find(r=>r.id===b.dataset.renew),'renew',i));c.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let r=records().find(x=>x.id===b.dataset.del);if(confirm('Eliminare la registrazione?'+(r?.calendarExported?' Rimuovi anche l’evento dal calendario.':''))&&set('records',records().filter(r=>r.id!==b.dataset.del))){notify('Registrazione eliminata');openSection(i)}});c.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let r=records().find(r=>r.id===b.dataset.done);if(!r)return;if(r.section===4){editRecord(r,'complete',i);return}if(confirm('Concludere la scadenza?'+(r.calendarExported?' Rimuovi o aggiorna anche l’evento nel calendario.':''))&&set('records',records().map(x=>x.id===r.id?{...r,stato:'done'}:x))){notify('Scadenza conclusa');openSection(i)}});if(i!==5)$('record').onsubmit=e=>{e.preventDefault();let r={...Object.fromEntries(new FormData(e.target)),id:String(Date.now())+Math.random(),section:i,...(i===4?{stato:tab}:{})};if(!validate(r))return;if(set('records',[...records(),r])){notify('Registrazione salvata');openSection(i)}}}
function overview(i,all){let a=all.filter(r=>r.section===i),m=[];const euro=v=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(v);if(i===1)m=[['Da gestire',a.filter(due).length],['Entro 30 giorni',a.filter(r=>due(r)&&remaining(r)>=0&&remaining(r)<=30).length],['Scadute',a.filter(r=>due(r)&&remaining(r)<0).length]];if(i===2)m=[['Spese registrate',euro(a.reduce((n,r)=>n+(Number(r.importo)||0),0))],['Movimenti',a.length]];if(i===4)m=[['Programmate',a.filter(r=>status(r)==='planned').length],['Effettuate',a.filter(r=>status(r)==='done').length]];if(i===5)m=[['Registrazioni',all.filter(r=>r.section!==3).length],['Da gestire',all.filter(due).length]];return m.length?'<div class="overview">'+m.map(([k,v])=>'<div class="metric"><small>'+esc(k)+'</small><b>'+esc(v)+'</b></div>').join('')+'</div>':''}
function validate(r){if(!String(r.descrizione||'').trim()){alert('Inserisci una descrizione');return false}if(!Number.isFinite(day(r.data))){alert('Data non valida');return false}if(r.section===4&&status(r)==='done'&&day(r.data)>today()){alert('Una manutenzione effettuata non può avere una data futura');return false}if(r.importo!==undefined&&r.importo!==''&&(!Number.isFinite(Number(r.importo))||Number(r.importo)<0)){alert('Importo non valido');return false}return true}
function localDate(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function editRecord(r,mode,i){if(!r||!fields[r.section])return;let d=document.createElement('dialog'),values={...r};if(mode==='complete')values.data=localDate();if(mode==='renew')values.data='';d.innerHTML=`<h2>${mode==='complete'?'Completa manutenzione':mode==='renew'?'Rinnova scadenza':'Modifica registrazione'}</h2><form>${fields[r.section].map(([k,l,t])=>`<label>${esc(l)}<input name="${k}" type="${t}" value="${esc(values[k]??'')}" ${t==='number'?'min="0" step="any"':''} ${r.section!==4||['descrizione','data'].includes(k)?'required':''}></label>`).join('')}${r.section===4&&mode==='edit'?`<label>Stato<select name="stato"><option value="planned" ${status(r)==='planned'?'selected':''}>Programmata</option><option value="done" ${status(r)==='done'?'selected':''}>Effettuata</option></select></label>`:''}${r.calendarExported?'<p class="muted">Aggiorna manualmente anche l’evento già esportato nel calendario.</p>':''}<div class="actions"><button class="primary">Salva</button><button type="button" class="secondary" id="cancelEdit">Annulla</button></div></form>`;document.body.append(d);d.addEventListener('close',()=>d.remove());d.querySelector('#cancelEdit').onclick=()=>d.close();d.querySelector('form').onsubmit=e=>{e.preventDefault();let v={...r,...Object.fromEntries(new FormData(e.target))};if(mode==='complete')v.stato='done';if(!validate(v))return;let a=records();if(mode==='renew'){v={...v,id:String(Date.now())+Math.random(),stato:'planned',calendarExported:false};a=a.map(x=>x.id===r.id?{...x,stato:'done'}:x);a.push(v)}else{if(mode==='complete'){v.dataProgrammata=r.data;v.stato='done'}if(v.data!==r.data||v.descrizione!==r.descrizione)v.calendarExported=false;a=a.map(x=>x.id===r.id?v:x)}if(set('records',a)){d.close();if(mode==='complete'&&i===4)tab='done';notify('Registrazione salvata');openSection(i)}};d.showModal()}
function validBackupRecord(r){if(!r||typeof r!=='object'||Array.isArray(r)||typeof r.id!=='string'||!r.id.trim()||![1,2,3,4].includes(r.section)||!Number.isFinite(day(r.data)))return false;if(r.section!==3&&(typeof r.descrizione!=='string'||!r.descrizione.trim()))return false;if(r.stato!==undefined&&!['planned','done'].includes(r.stato))return false;if(r.calendarExported!==undefined&&typeof r.calendarExported!=='boolean')return false;for(const k of ['importo','km','litri'])if(r[k]!==undefined&&r[k]!==''&&(!(typeof r[k]==='number'||typeof r[k]==='string'&&r[k].trim())||!Number.isFinite(Number(r[k]))||Number(r[k])<0))return false;for(const k of ['officina','note'])if(r[k]!==undefined&&typeof r[k]!=='string')return false;if(r.dataProgrammata!==undefined&&!Number.isFinite(day(r.dataProgrammata)))return false;return true}
function validBackupAuto(a){return a===null||!!a&&typeof a==='object'&&!Array.isArray(a)&&['modello','note'].every(k=>a[k]===undefined||typeof a[k]==='string')&&['anno','km'].every(k=>a[k]===undefined||a[k]===''||((typeof a[k]==='string'||typeof a[k]==='number')&&Number.isFinite(Number(a[k]))&&Number(a[k])>=0))}
const keys=['auto','records','car','plate'];
$('backup').onclick=()=>{let data={format:'myPanda-backup',version:1,data:Object.fromEntries(keys.map(k=>[k,get(k,k==='records'?[]:null)]))};let f=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(f),a=document.createElement('a');a.href=url;a.download='myPanda-backup-'+localDate()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notify('Backup preparato')};
$('restore').onclick=()=>$('backupFile').click();$('backupFile').onchange=async()=>{let f=$('backupFile').files[0];$('backupFile').value='';if(!f)return;try{if(f.size>12000000)throw Error();let b=JSON.parse(await f.text()),d=b.data;if(b.format!=='myPanda-backup'||b.version!==1||!d||!keys.every(k=>Object.hasOwn(d,k))||!Array.isArray(d.records)||!(d.auto===null||typeof d.auto==='object'&&!Array.isArray(d.auto))||!['car','plate'].every(k=>d[k]===null||typeof d[k]==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(d[k]))||!d.records.every(validBackupRecord)||!validBackupAuto(d.auto)||new Set(d.records.map(r=>r.id)).size!==d.records.length)throw Error();if(!confirm('Il ripristino sostituisce i dati attuali. Continuare?'))return;let before=Object.fromEntries(keys.map(k=>[k,localStorage.getItem('mypanda:'+k)]));try{for(let k of keys)localStorage.removeItem('mypanda:'+k);for(let k of keys)localStorage.setItem('mypanda:'+k,JSON.stringify(d[k]))}catch(e){for(let k of keys)localStorage.removeItem('mypanda:'+k);for(let k of keys)if(before[k]!==null)localStorage.setItem('mypanda:'+k,before[k]);throw e}showPhoto('car');showPhoto('plate');refresh();notify('Backup ripristinato')}catch(e){alert('Backup non valido o spazio insufficiente. Ripristino non completato.')}};
history.replaceState({mypanda:null},'');window.addEventListener('popstate',e=>{const i=e.state?.mypanda;if([0,1,2,4,5].includes(i))openSection(i,true);else showHome()});refresh();window.addEventListener('pageshow',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
