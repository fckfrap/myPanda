<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>myPanda | Garage personale</title><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" href="icon.png"><meta name="theme-color" content="#151719"><style>
*{box-sizing:border-box}body{margin:0;background:#111315;color:#f7f8f9;font:15px system-ui,sans-serif}main{max-width:940px;margin:auto;padding:24px 18px 40px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #303438;padding-bottom:18px}header img{width:145px;max-height:65px;object-fit:contain}small,.muted{color:#a2a8ad}.tag{font-size:11px;letter-spacing:2px;color:#b9f451;font-weight:700}h1{font-size:clamp(27px,5vw,44px);margin:8px 0}h2{font-size:19px;margin:28px 0 14px}.hero{margin-top:24px;border:1px solid #34393b;background:linear-gradient(140deg,#252a2b,#181a1c 75%);border-radius:22px;padding:24px}.vehicle{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:center;margin-top:18px}.photo{position:relative;min-height:170px;border:1px dashed #535d55;border-radius:15px;display:grid;place-items:center;text-align:center;overflow:hidden;background:#181b1d}.photo img{width:100%;height:100%;max-height:260px;object-fit:contain;display:none}.photo.has img{display:block}.photo.has .placeholder{display:none}.photo input{display:none}.photo label{cursor:pointer;padding:15px}.photo .change{position:absolute;bottom:7px;right:7px;background:#111d;color:white;border-radius:7px;padding:5px 8px;display:none}.photo.has .change{display:block}.plate{min-height:100px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}button{font:inherit;cursor:pointer}.tile{color:white;background:#202325;border:1px solid #353a3d;border-radius:16px;text-align:left;padding:20px;min-height:115px;display:flex;flex-direction:column;gap:10px}.tile:hover,.tile:focus-visible{border-color:#b9f451}.tile svg{width:26px;height:26px;stroke:#b9f451;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.tile b{font-size:16px}.tile small{font-size:12px}.panel{background:#202325;border:1px solid #353a3d;padding:20px;border-radius:16px}footer{text-align:center;color:#899095;font-size:12px;margin-top:32px}input,textarea{font:inherit;background:#151719;color:white;border:1px solid #454a4d;border-radius:9px;padding:12px;width:100%;margin:5px 0 14px}label{color:#c8cccf}.primary{background:#b9f451;color:#192008;border:0;border-radius:9px;padding:12px 16px;font-weight:700}.back{border:0;background:none;color:#b9f451;padding:12px 0}.entry{padding:12px 0;border-bottom:1px solid #414548;overflow-wrap:anywhere}.entry button{float:right;background:none;color:#ddd;border:0}.hidden{display:none}@media(max-width:560px){main{padding:18px 14px}.hero{padding:18px}.vehicle{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.tile{padding:15px;min-height:105px}.photo{min-height:145px}.plate{min-height:75px}}
</style></head><body><main><header><img src="logo.png" alt="myPanda"><small>GARAGE PERSONALE</small></header><section id="home"><div class="hero"><span class="tag">LA MIA AUTO</span><h1>Fiat Panda Hybrid</h1><div class="muted">2023 · Bianco · Benzina / mild hybrid</div><div class="vehicle"><div class="photo" id="carBox"><img alt="Foto della Panda"><label class="placeholder" for="car">＋ Aggiungi foto della Panda</label><label class="change" for="car">Cambia</label><input id="car" type="file" accept="image/*"></div><div><small>TARGA</small><div class="photo plate" id="plateBox"><img alt="Foto della targa"><label class="placeholder" for="plate">＋ Aggiungi targa</label><label class="change" for="plate">Cambia</label><input id="plate" type="file" accept="image/*"></div></div></div></div><h2>Il mio garage</h2><div class="grid" id="menu"></div></section><section id="detail" class="hidden"><button class="back" id="back">← Garage</button><h1 id="sectionTitle"></h1><div class="panel" id="content"></div></section><footer>myPanda · v1.0.0 · Dati salvati su questo browser</footer></main><script>
const sections=[['Dati auto','Informazioni e chilometraggio','<path d="M3 16v-5l3-6h12l3 6v5M3 11h18M5 16v3m14-3v3M6 14h2m8 0h2"/>'],['Scadenze','Bollo, assicurazione, revisione','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h4"/>'],['Spese','Costi e pagamenti','<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M16 10h5v5h-5a2.5 2.5 0 0 1 0-5z"/>'],['Rifornimenti','Carburante e consumi','<path d="M4 21V4h11v17M2 21h15M6 7h7v6H6zM15 14h2v4a2 2 0 0 0 4 0v-7l-3-3"/>'],['Manutenzione','Tagliandi e interventi','<path d="M14 6a5 5 0 0 0-6 6L3 17l4 4 5-5a5 5 0 0 0 6-6l-3 3-4-4z"/>'],['Storico','Tutte le registrazioni','<path d="M3 12a9 9 0 1 0 3-7L3 8m0-5v5h5m4-1v6l4 2"/>']];
const $=id=>document.getElementById(id),get=(k,d)=>{try{return JSON.parse(localStorage.getItem('mypanda:'+k))??d}catch{return d}},set=(k,v)=>{try{localStorage.setItem('mypanda:'+k,JSON.stringify(v));return true}catch{alert('Spazio di salvataggio insufficiente o non disponibile.');return false}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
sections.forEach(([name,desc,svg],i)=>{let b=document.createElement('button');b.className='tile';b.innerHTML=`<svg viewBox="0 0 24 24">${svg}</svg><b>${name}</b><small>${desc}</small>`;b.onclick=()=>openSection(i);$('menu').append(b)});$('back').onclick=()=>{$('detail').classList.add('hidden');$('home').classList.remove('hidden')};
for(const key of ['car','plate']){const box=$(key+'Box'),img=box.querySelector('img');const show=v=>{if(v){img.src=v;box.classList.add('has')}};show(get(key,null));$(key).onchange=()=>{let f=$(key).files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let a=new Image();a.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(a.width,a.height));c.width=Math.round(a.width*scale);c.height=Math.round(a.height*scale);c.getContext('2d').drawImage(a,0,0,c.width,c.height);let v=c.toDataURL('image/jpeg',.85);if(set(key,v))show(v)};a.src=r.result};r.readAsDataURL(f)}}
const fields={1:[['descrizione','Scadenza','text'],['data','Data','date']],2:[['descrizione','Descrizione','text'],['data','Data','date'],['importo','Importo (€)','number']],3:[['data','Data','date'],['litri','Litri','number'],['importo','Importo (€)','number'],['km','Chilometraggio','number']],4:[['descrizione','Intervento','text'],['data','Data','date'],['km','Chilometraggio','number'],['importo','Costo (€)','number']]};
function openSection(i){$('home').classList.add('hidden');$('detail').classList.remove('hidden');$('sectionTitle').textContent=sections[i][0];const c=$('content');if(i===0){let d=get('auto',{});c.innerHTML='<form id="record"><label>Modello<input name="modello" value="'+esc(d.modello||'Fiat Panda Hybrid')+'" required></label><label>Anno<input name="anno" type="number" value="'+esc(d.anno||2023)+'"></label><label>Chilometri<input name="km" type="number" min="0" value="'+esc(d.km||'')+'"></label><label>Note<textarea name="note">'+esc(d.note||'')+'</textarea></label><button class="primary">Salva</button></form>';$('record').onsubmit=e=>{e.preventDefault();if(set('auto',Object.fromEntries(new FormData(e.target))))alert('Dati salvati')};return}let all=get('records',[]);let rows=all.filter(r=>i===5||r.section===i).sort((a,b)=>(b.data||'').localeCompare(a.data||''));let form=i===5?'':`<form id="record">${fields[i].map(([k,l,t])=>`<label>${l}<input name="${k}" type="${t}" ${t==='number'?'min="0" step="any"':''} required></label>`).join('')}<button class="primary">Aggiungi</button></form><h2>Registrazioni</h2>`;c.innerHTML=form+(rows.length?rows.map(r=>`<div class="entry"><button data-id="${r.id}" aria-label="Elimina">✕</button><b>${esc(sections[r.section][0])}</b><div>${Object.entries(r).filter(([k])=>!['id','section'].includes(k)).map(([k,v])=>esc(k)+': '+esc(v)).join(' · ')}</div></div>`).join(''):'<p class="muted">Nessuna registrazione.</p>');c.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{if(confirm('Eliminare la registrazione?')&&set('records',get('records',[]).filter(r=>r.id!==b.dataset.id)))openSection(i)});if(i!==5)$('record').onsubmit=e=>{e.preventDefault();let r={...Object.fromEntries(new FormData(e.target)),id:String(Date.now())+Math.random(),section:i};if(set('records',[...get('records',[]),r]))openSection(i)}}
</script></body></html>
