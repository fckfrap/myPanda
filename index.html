function charts14(){let a=costs14(),year=localDate().slice(0,4),y=a.filter(r=>r.data?.startsWith(year)),monthly=Array.from({length:12},(_,i)=>[new Date(2020,i,1).toLocaleString('it',{month:'short'}),sum14(y.filter(r=>+r.data.slice(5,7)===i+1))]),cats=categories.map(c=>[c,sum14(y.filter(r=>(r.section===4?'Manutenzione':categories.includes(r.categoria)?r.categoria:'Altro')===c))]);const chart=(title,arr)=>{let max=Math.max(1,...arr.map(x=>x[1]));return `<div class="settings-card"><h2>${title}</h2>${arr.map(([k,v])=>`<div class="chart-row"><span>${esc(k)}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><span>${euro14(v)}</span></div>`).join('')}</div>`};return chart('Andamento mensile · '+year,monthly)+chart('Categorie · '+year,cats)}
function download14(data,name,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function csv14(){let safe=v=>'"'+String(v??'').replace(/^[\s]*[=+@-]/,"'$&").replaceAll('"','""')+'"';download14('\ufeffData;Descrizione;Categoria;Importo\r\n'+costs14().map(r=>[r.data,label(r),r.section===4?'Manutenzione':r.categoria||'Altro',String(r.importo??'').replace('.',',')].map(safe).join(';')).join('\r\n'),'myPanda-spese.csv','text/csv;charset=utf-8')}
function renderSettings(){let p=pref();$('content').innerHTML=`<div class="settings-card"><h2>Aspetto</h2><label>Tema<select id="theme14"><option value="dark">Scuro</option><option value="light">Chiaro</option><option value="auto">Automatico</option></select></label><h2>Personalizza Home</h2>${['Prossima scadenza','Spese del mese','Prossima manutenzione','Spese annuali'].map((l,i)=>`<label><input type="checkbox" data-tile="${i}" ${p.tiles.includes(i)?'checked':''}>${l}</label>`).join('')}</div><div class="settings-card"><h2>Backup e ripristino</h2><p class="muted">Ultimo backup preparato: ${esc(get('lastBackup','Mai'))}</p><button class="secondary" id="backup14">Esporta backup</button> <button class="secondary" id="restore14">Ripristina backup</button></div><div class="settings-card"><h2>Notifiche</h2><p>Promemoria in-app e calendario disponibili. Push non ancora configurate.</p></div><div class="settings-card"><h2>myPanda ${BUILD}</h2><p>Garage personale · Dati locali</p><button class="secondary" id="update14">Controlla aggiornamenti</button> <button class="secondary" id="log14">Changelog</button><p id="updateStatus" role="status"></p></div>`;$('theme14').value=p.theme;$('theme14').onchange=e=>{if(set('prefs',{...pref(),theme:e.target.value}))applyTheme()};$('content').querySelectorAll('[data-tile]').forEach(b=>b.onchange=()=>{set('prefs',{...pref(),tiles:[...$('content').querySelectorAll('[data-tile]:checked')].map(x=>+x.dataset.tile)});refresh()});$('backup14').onclick=()=>$('backup').click();$('restore14').onclick=()=>$('restore').click();$('log14').onclick=()=>go(7);$('update14').onclick=checkUpdate14}
async function checkUpdate14(){let node=$('updateStatus');try{let r=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();let v=await r.json();if(typeof v.version!=='string')throw Error();node.textContent=v.version===BUILD?'Versione aggiornata.':'Versione pubblicata: '+v.version; if(v.version!==BUILD){let b=document.createElement('button');b.className='primary';b.textContent='Ricarica myPanda';b.onclick=()=>{let u=new URL(location.href);u.searchParams.set('v',v.version);location.replace(u)};node.append(' ',b)}}catch{node.textContent='Controllo non disponibile: verifica la connessione e il file version.json.'}}
const changes14=[['1.4.0-preview','Frontend in sviluppo: temi, navigazione, dashboard, categorie, grafici, filtri, scheda veicolo, impostazioni, changelog. Push non configurate.'],['1.3.2','Foto integrali, gestione tramite tocco, pulsanti non sovrapposti. Versione preparata, non pubblicazione confermata.'],['1.3.1','Correzioni navigazione, date future, backup, griglia, riepiloghi e calendario.'],['1.3.0','Transizioni, restyling dei menu e indicatori.'],['1.2.1','Modifica registrazioni, validazione, backup, rinnovi, gestione immagini.'],['1.2.0','Esportazione e condivisione calendario ICS.'],['1.1.0','Manutenzioni programmate/effettuate, promemoria, rimozione rifornimenti e chilometraggio.'],['1.0.0','Prima homepage, logo, fotografie locali, menu e registrazioni.']];function renderLog(){ $('content').innerHTML='<div class="settings-card">'+changes14.map(([v,t],i)=>`<details ${i===0?'open':''}><summary>v${v}${i===0?' · corrente':''}</summary><p>${esc(t)}</p></details>`).join('')+'</div>'}
function enhance14(i){let c=$('content');if(i===0){let a=get('auto',{}),f=$('record');let extra=[['motore','Motorizzazione'],['potenza','Potenza'],['alimentazione','Alimentazione'],['immatricolazione','Prima immatricolazione'],['assicurazione','Contatto assicurazione'],['meccanico','Meccanico'],['carrozziere','Carrozziere'],['soccorso','Soccorso stradale']];f.querySelector('.primary').insertAdjacentHTML('beforebegin',extra.map(([k,l])=>`<label>${l}<input name="${k}" value="${esc(a[k]??'')}"></label>`).join(''));return}if(![1,2,4,5].includes(i))return;let cards=[...c.querySelectorAll('[data-record]')];let box=document.createElement('div');box.className='filterrow';box.innerHTML='<input type="search" placeholder="Cerca registrazioni" aria-label="Cerca registrazioni"><select aria-label="Periodo o stato">'+(i===1?'<option value="">Tutte</option><option value="late">Scadute</option><option value="soon">Entro 30 giorni</option><option value="done">Concluse</option>':'<option value="">Tutti i periodi</option><option value="month">Questo mese</option><option value="year">Quest’anno</option>')+'</select>';let first=c.querySelector('.recordcard,.empty');if(first)first.before(box);const [q,sel]=box.children;function filter(){let d=localDate();cards.forEach(card=>{let r=records().find(x=>x.id===card.dataset.record);if(!r)return;let v=sel.value;card.hidden=!card.textContent.toLowerCase().includes(q.value.toLowerCase())||!(v===''||v==='month'&&r.data.startsWith(d.slice(0,7))||v==='year'&&r.data.startsWith(d.slice(0,4))||v==='late'&&due(r)&&remaining(r)<0||v==='soon'&&due(r)&&remaining(r)>=0&&remaining(r)<=30||v==='done'&&!due(r))})}q.oninput=sel.onchange=filter;if(i===2){let f=c.querySelector('[name=categoria]');if(f){let e=document.createElement('select');e.name='categoria';e.innerHTML=categories.map(k=>`<option>${k}</option>`).join('');e.value='Altro';f.replaceWith(e)}let charts=document.createElement('div');charts.innerHTML=charts14()+'<button class="secondary" id="csv14">Esporta CSV</button>';c.prepend(charts);$('csv14').onclick=csv14}if(i===4){let total=document.createElement('div');total.className='settings-card';total.textContent='Costo interventi effettuati: '+euro14(sum14(records().filter(r=>r.section===4&&status(r)==='done')));c.prepend(total)}}
const oldOpen=openSection;openSection=function(i,fromHistory=false){if(i<6){oldOpen(i,fromHistory);enhance14(i)}else{let entering=currentSection!==i;if(entering&&!fromHistory)history.pushState({mypanda:i},'');currentSection=i;$('home').classList.add('hidden');$('detail').classList.remove('hidden');$('sectionTitle').textContent=sections[i][0];$('sectionSubtitle').textContent=sections[i][1];$('sectionIcon').innerHTML='<svg viewBox="0 0 24 24">'+sections[i][2]+'</svg>';if(i===6)renderSettings();else renderLog();if(entering){animateScreen($('detail'),'screen-in');window.scrollTo(0,0)}}navActive()};
const oldHome=showHome;showHome=function(){oldHome();navActive()};
refresh();window.addEventListener("pageshow",()=>refresh());
